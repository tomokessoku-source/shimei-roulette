<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指名ルーレット</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#fff; --ink:#1f2933; --sub:#5b6773; --line:#dfe4ea;
    --accent:#2f6fb0; --accent-weak:#e8f0f8; --accent2:#e07b39;
    --ok:#1e7a46; --okbg:#e6f4ec; --danger:#c0392b;
    --radius:12px; --shadow:0 1px 3px rgba(31,41,51,.08),0 4px 14px rgba(31,41,51,.06);
    font-family:"UD デジタル 教科書体 NP-R","BIZ UDPゴシック","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:19px;font-family:"BIZ UDPゴシック",sans-serif}
  header .sub{color:var(--sub);font-size:12px;margin-top:1px}
  header .htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px}
  .grid2{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
  @media(max-width:840px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .card h2{margin:0;padding:11px 15px;font-size:14px;font-family:"BIZ UDPゴシック",sans-serif;background:var(--accent-weak);color:var(--accent);border-bottom:1px solid var(--line)}
  .card .body{padding:14px 15px}
  label{font-size:12.5px;color:var(--sub);display:block;margin:6px 0 4px}
  input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:150px;line-height:1.6}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13.5px;font-family:inherit;transition:.12s}
  button:hover{background:#f0f3f6}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.primary:hover{background:#255a90}
  button.mini{padding:4px 9px;font-size:12px}
  button.danger{color:var(--danger);border-color:#e8b7b1}
  button.danger:hover{background:#fbe0e0}
  button.ghost{background:transparent}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .btnbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .hint{font-size:11.5px;color:var(--sub);margin-top:6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;border-radius:0;border-right:1px solid var(--line);background:#fff;font-size:13px}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:#fff}
  /* ステージ */
  .stage{background:linear-gradient(160deg,#20364a,#2f6fb0);border-radius:16px;box-shadow:var(--shadow);
    padding:34px 20px;text-align:center;color:#fff;position:relative;overflow:hidden;min-height:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .stage .label{font-size:14px;letter-spacing:.2em;color:#cfe2f3;font-family:"BIZ UDPゴシック",sans-serif}
  .stage .name{font-size:clamp(40px,9vw,96px);font-weight:800;font-family:"BIZ UDPゴシック",sans-serif;
    line-height:1.15;text-shadow:0 3px 12px rgba(0,0,0,.28);word-break:break-word}
  .stage .name.small{font-size:clamp(28px,6vw,60px)}
  .stage.spin .name{opacity:.9;filter:blur(.3px)}
  .stage.result .name{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .stage .members{font-size:clamp(16px,2.4vw,24px);color:#eaf3fb;font-family:"BIZ UDPゴシック",sans-serif;line-height:1.5}
  .stage .subinfo{font-size:12.5px;color:#bcd6ec}
  .bigbtn{font-size:20px;padding:16px 34px;border-radius:14px;background:var(--accent2);color:#fff;border:none;font-weight:700;
    box-shadow:0 4px 0 #b25f24;font-family:"BIZ UDPゴシック",sans-serif;letter-spacing:.08em}
  .bigbtn:hover{background:#cf6f30}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b25f24}
  .bigbtn[disabled]{background:#94a3b0;box-shadow:0 4px 0 #7c8894}
  .stagebar{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
  .roundinfo{font-size:13px;color:var(--sub);text-align:center;margin-top:10px}
  /* 名簿リスト */
  .students{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;background:#fbfcfd}
  .chip.absent{opacity:.45;text-decoration:line-through}
  .chip .cnt{background:var(--accent-weak);color:var(--accent);border-radius:999px;font-size:11px;min-width:20px;text-align:center;padding:1px 6px;font-weight:700}
  .chip .cnt.zero{background:#eef1f4;color:#9aa4ad}
  .chip .grp{background:#f0e6da;color:#8a6a3f;border-radius:999px;font-size:10px;padding:1px 5px}
  .chip button{border:none;background:transparent;color:var(--sub);padding:2px 4px;font-size:12px;border-radius:6px}
  .chip button:hover{background:#e6ebf0;color:var(--danger)}
  .toolrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .rank{list-style:none;margin:8px 0 0;padding:0}
  .rank li{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 2px;border-bottom:1px dashed var(--line)}
  .rank li .bar{height:10px;background:var(--accent);border-radius:5px;min-width:3px}
  .rank li .rn{flex:0 0 auto;color:var(--sub);width:2.4em}
  .rank li .nm{flex:0 0 7em;font-family:"BIZ UDPゴシック",sans-serif}
  .hist{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px}
  .hist span{background:#eef1f4;border-radius:6px;padding:2px 8px}
  details summary{cursor:pointer;color:var(--accent);font-size:13px}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none}
</style>
</head>
<body>
<header>
  <div>
    <h1>指名ルーレット</h1>
    <div class="sub">全員に発言のチャンスを／児童名はこの端末内だけに保存（外部送信なし）</div>
  </div>
  <div class="htools">
    <label class="switch"><input type="checkbox" id="muteChk" onchange="toggleMute()"> 音を消す</label>
    <button class="mini ghost" onclick="toggleFullscreen()">⛶ 全画面</button>
  </div>
</header>

<div class="wrap">
<div class="grid2">
  <!-- 左：名簿・設定 -->
  <div>
    <div class="card">
      <h2>名簿</h2>
      <div class="body">
        <label>1行に1人ずつ（出席番号順）</label>
        <textarea id="roster" placeholder="山田 たろう&#10;佐藤 はなこ&#10;鈴木 いちろう&#10;…"></textarea>
        <div class="btnbar">
          <button class="primary mini" onclick="applyRoster()">名簿を反映</button>
          <span class="hint" id="rosterCount" style="align-self:center"></span>
        </div>
        <p class="hint">反映後は下のチップで <b>名前クリック＝欠席/出席の切替</b>。今日休みの子を外せます。</p>
      </div>
    </div>

    <div class="card">
      <h2>指名モード</h2>
      <div class="body">
        <div class="seg" id="modeSeg">
          <button data-mode="even" class="on" onclick="setMode('even')">均等（全員1巡）</button>
          <button data-mode="random" onclick="setMode('random')">ランダム</button>
          <button data-mode="group" onclick="setMode('group')">班</button>
        </div>
        <div id="groupOpt" style="display:none">
          <label>班の数（出席番号順に均等分け）</label>
          <input type="number" id="groupCount" min="2" max="12" value="6" onchange="applyGroupCount()">
        </div>
        <p class="hint" id="modeDesc">同じ子が続かないよう、全員が1回ずつ指名されるまで重複しません。</p>
      </div>
    </div>

    <div class="card">
      <h2>リセット</h2>
      <div class="body">
        <div class="btnbar">
          <button class="mini" onclick="resetRound()">1巡をリセット</button>
          <button class="mini" onclick="resetCounts()">発言回数をリセット</button>
          <button class="mini" onclick="allPresent()">全員を出席に</button>
        </div>
        <div class="btnbar">
          <button class="mini danger" onclick="resetAll()">名簿ごと全消去</button>
        </div>
        <p class="hint">この端末に自動保存されます（次回開くと復元）。</p>
      </div>
    </div>
  </div>

  <!-- 右：ステージ -->
  <div>
    <div class="stage" id="stage">
      <div class="label" id="stageLabel">つぎは だれかな？</div>
      <div class="name" id="stageName">— —</div>
      <div class="members" id="stageMembers"></div>
      <div class="subinfo" id="stageSub"></div>
    </div>
    <div class="stagebar">
      <button class="bigbtn" id="spinBtn" onclick="spin()">🎯 指名する</button>
    </div>
    <div class="roundinfo" id="roundInfo"></div>

    <div class="card" style="margin-top:18px">
      <h2>発言回数</h2>
      <div class="body">
        <div class="toolrow">
          <span class="hint" id="presentInfo"></span>
        </div>
        <div class="students" id="chips"></div>
        <details style="margin-top:12px">
          <summary>回数ランキングを見る</summary>
          <ul class="rank" id="rank"></ul>
        </details>
        <div style="margin-top:12px">
          <label>直近の指名</label>
          <div class="hist" id="hist"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
/* ===================== 状態 ===================== */
let state={
  students:[],        // {id,name,present,count}
  mode:"even",        // even | random | group
  groupCount:6,
  round:[],           // 均等モードで今巡すでに指名したid
  history:[],         // 直近の名前（新しい順）
  muted:false
};
const uid=()=>Math.random().toString(36).slice(2,9);
let spinning=false;

/* ===================== 初期化 ===================== */
function init(){
  const s=localStorage.getItem("shimei_v1");
  if(s){try{state=Object.assign(state,JSON.parse(s));}catch(e){}}
  document.getElementById("roster").value=state.students.map(x=>x.name).join("\n");
  document.getElementById("groupCount").value=state.groupCount;
  document.getElementById("muteChk").checked=state.muted;
  setMode(state.mode,true);
  render();
}
function save(){localStorage.setItem("shimei_v1",JSON.stringify(state));}

/* ===================== 名簿 ===================== */
function applyRoster(){
  const lines=document.getElementById("roster").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const old=state.students;
  state.students=lines.map(name=>{
    const ex=old.find(o=>o.name===name);
    return ex?ex:{id:uid(),name,present:true,count:0};
  });
  const ids=new Set(state.students.map(s=>s.id));
  state.round=state.round.filter(id=>ids.has(id));
  save();render();
}
function present(){return state.students.filter(s=>s.present);}

/* ===================== モード ===================== */
function setMode(m,silent){
  state.mode=m;
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  document.getElementById("groupOpt").style.display=(m==="group")?"":"none";
  const desc={
    even:"同じ子が続かないよう、全員が1回ずつ指名されるまで重複しません。",
    random:"毎回すべての出席者から選びます（重複あり）。",
    group:"班をランダムに選びます。出席者がいる班だけが対象です。"
  };
  document.getElementById("modeDesc").textContent=desc[m];
  if(!silent){save();render();}
}
function applyGroupCount(){
  state.groupCount=Math.max(2,Math.min(12,parseInt(document.getElementById("groupCount").value||6,10)));
  document.getElementById("groupCount").value=state.groupCount;
  save();render();
}
// 出席番号順に均等分け → [[student,...], ...]
function groups(){
  const n=state.groupCount, arr=state.students, res=Array.from({length:n},()=>[]);
  arr.forEach((s,i)=>res[Math.floor(i*n/arr.length)].push(s));
  return res;
}

/* ===================== 抽選 ===================== */
function pickPerson(){
  const p=present();
  if(!p.length)return null;
  if(state.mode==="random"){
    return p[Math.floor(Math.random()*p.length)];
  }
  // even
  let cand=p.filter(s=>!state.round.includes(s.id));
  if(cand.length===0){ state.round=[]; cand=p; }   // 全員1巡→リセット
  return cand[Math.floor(Math.random()*cand.length)];
}
function pickGroup(){
  const gs=groups().map((m,i)=>({no:i+1,members:m,pm:m.filter(s=>s.present)})).filter(g=>g.pm.length>0);
  if(!gs.length)return null;
  return gs[Math.floor(Math.random()*gs.length)];
}

/* ===================== スピン演出 ===================== */
function spin(){
  if(spinning)return;
  const p=present();
  if(p.length===0){ flashLabel("名簿を反映して、出席者を1人以上にしてください"); return; }

  spinning=true;
  const stage=document.getElementById("stage");
  const nameEl=document.getElementById("stageName");
  const memEl=document.getElementById("stageMembers");
  const btn=document.getElementById("spinBtn");
  stage.classList.remove("result"); stage.classList.add("spin");
  btn.disabled=true; document.getElementById("stageLabel").textContent="ぐるぐる…";
  memEl.textContent=""; document.getElementById("stageSub").textContent="";

  const isGroup=state.mode==="group";
  const finalPick = isGroup ? pickGroup() : pickPerson();
  if(!finalPick){ spinning=false; stage.classList.remove("spin"); btn.disabled=false; flashLabel("対象がいません"); return; }

  const t0=Date.now(), dur=1500;
  const tick=()=>{
    if(isGroup){
      const g=pickGroup(); if(g){nameEl.className="name small";nameEl.textContent="第 "+g.no+" 班";}
    }else{
      const r=p[Math.floor(Math.random()*p.length)];
      nameEl.className="name"+(r.name.length>6?" small":""); nameEl.textContent=r.name;
    }
    beep(600+Math.random()*200,0.03);
    const elapsed=Date.now()-t0;
    if(elapsed<dur){
      setTimeout(tick, 60+elapsed/dur*140);   // だんだん遅く
    }else{
      settle(finalPick,isGroup);
    }
  };
  tick();
}
function settle(pick,isGroup){
  const stage=document.getElementById("stage");
  const nameEl=document.getElementById("stageName");
  const memEl=document.getElementById("stageMembers");
  stage.classList.remove("spin"); stage.classList.add("result");
  if(isGroup){
    nameEl.className="name"; nameEl.textContent="第 "+pick.no+" 班";
    memEl.textContent=pick.members.map(s=>s.name+(s.present?"":"（欠）")).join("　");
    document.getElementById("stageLabel").textContent="発表は…";
    state.history.unshift("第"+pick.no+"班");
  }else{
    nameEl.className="name"+(pick.name.length>6?" small":"");
    nameEl.textContent=pick.name;
    document.getElementById("stageLabel").textContent="あなたです！";
    const st=state.students.find(s=>s.id===pick.id);
    st.count++;
    if(state.mode==="even" && !state.round.includes(pick.id)) state.round.push(pick.id);
    state.history.unshift(pick.name);
  }
  state.history=state.history.slice(0,12);
  ding();
  spinning=false;
  document.getElementById("spinBtn").disabled=false;
  save();render();
}
function flashLabel(msg){
  const el=document.getElementById("stageLabel"); el.textContent=msg;
  setTimeout(()=>{el.textContent="つぎは だれかな？";},2500);
}

/* ===================== 描画 ===================== */
function render(){
  const p=present();
  document.getElementById("rosterCount").textContent=state.students.length?`${state.students.length}人`:"";
  document.getElementById("presentInfo").textContent=`出席 ${p.length}人 / 全 ${state.students.length}人`;

  // 巡の進捗
  const ri=document.getElementById("roundInfo");
  if(state.mode==="even" && p.length){
    const remain=p.filter(s=>!state.round.includes(s.id)).length;
    ri.textContent=`この巡 のこり ${remain}人（${p.length}人中）`;
  }else if(state.mode==="group"){
    const gc=groups().filter(g=>g.some(s=>s.present)).length;
    ri.textContent=`対象の班：${gc}班`;
  }else{ ri.textContent=""; }

  // チップ
  const chips=document.getElementById("chips");
  const gmap={}; if(state.mode==="group"){groups().forEach((m,i)=>m.forEach(s=>gmap[s.id]=i+1));}
  chips.innerHTML=state.students.map(s=>{
    const inRound=state.mode==="even"&&state.round.includes(s.id)&&s.present;
    const g=gmap[s.id]?`<span class="grp">班${gmap[s.id]}</span>`:"";
    return `<span class="chip ${s.present?"":"absent"}" style="${inRound?"outline:2px solid #cfe0f0;":""}">
      <span onclick="togglePresent('${s.id}')" style="cursor:pointer">${esc(s.name)}</span>
      ${g}<span class="cnt ${s.count?"":"zero"}">${s.count}</span>
      <button onclick="removeStudent('${s.id}')" title="削除">×</button></span>`;
  }).join("") || '<span class="hint">名簿を反映すると、ここに名前が並びます</span>';

  // ランキング
  const rank=document.getElementById("rank");
  const sorted=[...state.students].sort((a,b)=>b.count-a.count);
  const max=Math.max(1,...state.students.map(s=>s.count));
  rank.innerHTML=sorted.map((s,i)=>`<li><span class="rn">${i+1}.</span><span class="nm">${esc(s.name)}</span>
    <span class="bar" style="width:${s.count/max*160}px"></span><span>${s.count}回</span></li>`).join("");

  // 履歴
  document.getElementById("hist").innerHTML=state.history.length
    ? state.history.map(h=>`<span>${esc(h)}</span>`).join("") : '<span style="background:none">まだありません</span>';
}
function togglePresent(id){const s=state.students.find(x=>x.id===id);s.present=!s.present;save();render();}
function removeStudent(id){
  state.students=state.students.filter(s=>s.id!==id);
  state.round=state.round.filter(x=>x!==id);
  document.getElementById("roster").value=state.students.map(x=>x.name).join("\n");
  save();render();
}

/* ===================== リセット ===================== */
function resetRound(){state.round=[];save();render();flashLabel("1巡をリセットしました");}
function resetCounts(){state.students.forEach(s=>s.count=0);state.round=[];state.history=[];save();render();}
function allPresent(){state.students.forEach(s=>s.present=true);save();render();}
function resetAll(){
  if(!confirm("名簿・回数・履歴をすべて消します。よろしいですか？"))return;
  state={students:[],mode:"even",groupCount:6,round:[],history:[],muted:state.muted};
  document.getElementById("roster").value="";
  save();setMode("even");render();
}

/* ===================== 音 ===================== */
let actx=null;
function ac(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function beep(freq,dur){
  if(state.muted)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type="square";o.frequency.value=freq;o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0.04,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.start();o.stop(c.currentTime+dur);
}
function ding(){
  if(state.muted)return; const c=ac(); if(!c)return;
  [880,1174.7].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(c.destination);
    const t=c.currentTime+i*0.09;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.12,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.start(t);o.stop(t+0.42);
  });
}
function toggleMute(){state.muted=document.getElementById("muteChk").checked;save();}

/* ===================== 全画面 ===================== */
function toggleFullscreen(){
  const el=document.getElementById("stage");
  if(!document.fullscreenElement){ el.requestFullscreen&&el.requestFullscreen(); }
  else{ document.exitFullscreen&&document.exitFullscreen(); }
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
// スペースキーで指名
document.addEventListener("keydown",e=>{ if(e.code==="Space" && e.target.tagName!=="TEXTAREA" && e.target.tagName!=="INPUT"){e.preventDefault();spin();} });

init();
</script>
</body>
</html>
